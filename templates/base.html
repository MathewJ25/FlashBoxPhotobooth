<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashBox Photobooth</title>
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        /* Elegant warm studio photography background */
        background: linear-gradient(rgba(248, 245, 240, 0.95), rgba(240, 234, 225, 0.95)), 
                    url("https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1920&auto=format&fit=crop") 
                    no-repeat center center fixed;
        background-size: cover;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #2c3e50;
        display: flex;
        flex-direction: column;
      }
      
      /* Stylish Glassmorphism Navbar */
      .navbar {
        background: rgba(30, 35, 42, 0.92) !important;
        backdrop-filter: blur(10px);
        border-bottom: 2px solid #ffc107;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .navbar-brand {
        letter-spacing: 0.5px;
        transition: transform 0.2s ease;
      }
      .navbar-brand:hover {
        transform: scale(1.03);
      }

      /* Custom button effects */
      .btn-warning {
        background: linear-gradient(135deg, #ffc107, #ff9800);
        border: none;
        transition: all 0.3s ease;
      }
      .btn-warning:hover {
        background: linear-gradient(135deg, #ffca2c, #f57c00);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
      }

      /* Main content wrapper to push footer down */
      .main-content {
        flex: 1 0 auto;
      }

      /* Photography Styled Footer fixed at the bottom */
      footer {
        background: linear-gradient(135deg, #2c3e50, #1a252f) !important;
        color: #ecf0f1;
        border-top: 3px solid #ffc107;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        flex-shrink: 0;
      }
      footer a {
        transition: color 0.2s ease;
      }
      footer a:hover {
        color: #ffc107 !important;
        text-decoration: underline !important;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
      <div class="container-fluid">
        <a
          class="navbar-brand fw-bold text-warning fs-4"
          href="{{ url_for('index') }}"
          >📸 FlashBox Photobooth</a
        >
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="ms-auto d-flex align-items-center gap-3 mt-3 mt-lg-0">
            {% if current_user.is_authenticated %} 
              {% if current_user.role == 'admin' %}
                <a
                  href="{{ url_for('admin_dashboard') }}"
                  class="btn btn-outline-light btn-sm fw-bold px-3 py-2"
                  >⚡ Admin Dashboard</a
                >
              {% else %}
                <a
                  href="{{ url_for('customer_dashboard') }}"
                  class="btn btn-outline-light btn-sm fw-bold px-3 py-2"
                  >✨ Dashboard</a
                >
                <a
                  href="{{ url_for('chat') }}"
                  class="btn btn-outline
