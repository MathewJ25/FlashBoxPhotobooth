<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashBox Photobooth</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation bar o main container -->
    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Safe Script para sa Unread Count -->
    <script>
      setInterval(function () {
        let chatBtn = document.querySelector('a[href*="/chat"]');
        if (!chatBtn) return;

        fetch("/api/unread-count")
          .then((response) => {
             const contentType = response.headers.get("content-type");
             if (contentType && contentType.includes("application/json")) {
                 return response.json();
             }
             throw new TypeError("Not JSON");
          })
          .then((data) => {
            if (data && data.unread_count !== undefined) {
              let badge = document.getElementById("chat-badge");
              if (data.unread_count > 0) {
                if (!badge) {
                  chatBtn.classList.add("position-relative");
                  chatBtn.innerHTML += ` <span id="chat-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">${data.unread_count} New</span>`;
                } else {
                  badge.innerText = data.unread_count + " New";
                }
              } else if (badge) {
                badge.remove();
              }
            }
          })
          .catch((error) => {
             console.log("Not logged in or waiting for session.");
          });
      }, 3000);
    </script>
</body>
</html>
